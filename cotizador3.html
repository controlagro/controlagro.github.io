<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortes por sección - ControlAgro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pagina">
        <div class="marca">
            <a href="index.html" class="marca-link" aria-label="Ir al inicio">
                <img src="logo.png" alt="ControlAgro">
            </a>
        </div>

        <a href="index.html" class="volver">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Cotizadores
        </a>

        <div class="tarjeta" id="cotizador-container">
            <h1>Cortes por sección Integra 6000</h1>
            <span class="badge-lista">Lista 0225</span>

            <form class="cotizador-form" onsubmit="return false;">
                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <div class="select-wrap">
                        <select id="modelo"></select>
                    </div>
                </div>

                <div class="campo" id="campo-embragues">
                    <label for="embragues">Cantidad de embragues</label>
                    <div class="select-wrap">
                        <select id="embragues"></select>
                    </div>
                </div>
            </form>

            <div class="resultado">
                <div class="resultado-principal">
                    <span id="precio">USD 0.00</span>
                </div>
                <p class="descripcion" id="descripcion-modelo">Seleccioná un modelo para ver los detalles.</p>
            </div>

            <button id="shareBtn">Compartir por WhatsApp</button>
        </div>

        <p class="pie">ControlAgro · Agricultura de precisión</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="compartir.js"></script>
    <script src="script3.js"></script>
</body>
</html>
