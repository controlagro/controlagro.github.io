<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilotos INTEGRA 6000 - ControlAgro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pagina">
        <div class="marca">
            <a href="index.html" class="marca-link" aria-label="Ir al inicio">
                <img src="logo.png" alt="ControlAgro">
            </a>
        </div>

        <a href="index.html" class="volver">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Cotizadores
        </a>

        <div class="tarjeta" id="cotizador-container">
            <h1>Pilotos automáticos INTEGRA 6000</h1>
            <span class="badge-lista" id="badge-lista">Lista de precios</span>

            <form class="cotizador-form" onsubmit="return false;">
                <div class="campo">
                    <label for="tipo">Tipo de activación y abono</label>
                    <div class="select-wrap">
                        <select id="tipo"></select>
                    </div>
                </div>
            </form>

            <div class="resultado oculto" id="resultado">
                <div class="resultado-principal">
                    <span id="precio">USD 0,00</span>
                </div>

                <div class="descripcion-principal" id="descripcion"></div>

                <div class="formas-pago" id="formas-pago"></div>

                <p class="iva-nota" id="iva-nota"></p>
            </div>

            <button id="shareBtn">Compartir por WhatsApp</button>
        </div>

        <p class="pie">Instalación e IVA incluidos. Precios en USD, dólar billete Banco Nación tipo vendedor.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="compartir.js"></script>
    <script src="script2.js"></script>
</body>
</html>
