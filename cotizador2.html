<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo piloto automático INTEGRA 6000</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cotizador-container" id="cotizador-container">
        <!-- Inserta tu logo aquí -->
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo">
        </div>
        <h1>Equipo piloto automático INTEGRA 6000 (LP 0225)</h1>
        <form class="cotizador-form">
            <label for="tipo">Tipo de activación y abono:</label>
            <select id="tipo"></select>

            <button type="button" id="calcular">Calcular precio</button>
        </form>
        <div class="resultado">
            <p><span id="precio">USD 0.00</span></p>
            <p class="descripcion-principal"></p>
        </div>
        <!-- Botón para capturar la pantalla y compartir en WhatsApp -->
        <button id="shareBtn">Compartir por WhatsApp</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script2.js"></script>
</body>
</html>
